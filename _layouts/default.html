<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">

    <title>{{ page.title }} - {{ site.title }}</title>
    {% seo %}

    {% if site.github.build_revision %}
      {% assign css_version = site.github.build_revision %}
    {% else %}
      {% assign css_version = site.time | date: '%s' %}
    {% endif %}

    <style>
      :root {
        --c-bg: #f6f6f6;
        --c-surface: #ffffff;
        --c-border: #d4d4d4;
        --c-text: #1a1a1f;
        --c-muted: #68686b;
        --c-navy: #3584e4;
        --c-navy-mid: #1c71d8;
        --c-navy-pale: #daeafa;
        --sp-1: 0.375rem;
        --sp-2: 0.75rem;
        --sp-3: 1.125rem;
        --sp-4: 1.5rem;
        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 7px;
      }
      body.site-shell {
        margin: 0;
        font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        color: var(--c-text);
        background: var(--c-bg);
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 40;
        background: #fff;
        border-bottom: 1px solid var(--c-border);
      }
      .compact-nav {
        max-width: 860px;
        margin: 0 auto;
        padding: 0.5rem var(--sp-2);
      }
      .menu-items {
        display: flex;
        justify-content: center;
        gap: 0.25rem;
      }
      .navbar-item {
        padding: 0.4rem 0.8rem;
        border-radius: var(--r-sm);
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--c-text);
        text-decoration: none;
      }
      .landing-page,
      .about-page,
      .blog-page,
      .post-page {
        max-width: 780px;
        margin: var(--sp-2) auto 0;
        padding: 0 var(--sp-2) var(--sp-4);
      }
      .profile-container,
      .about-container,
      .blog-container,
      .post-container {
        background: var(--c-surface);
        border: 1px solid var(--c-border);
        border-radius: var(--r-lg);
        padding: 1.35rem;
      }
      .hero-organic-tile {
        display: grid;
        grid-template-columns: 196px 1fr;
        gap: var(--sp-3);
        align-items: center;
      }
      .avatar-blob {
        width: 180px;
        height: 180px;
      }
      .profile-picture {
        width: 160px;
        height: 160px;
        object-fit: cover;
      }
      @media (max-width: 720px) {
        .hero-organic-tile {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <link rel="preload" as="style" href="{{ "/assets/css/style.css" | relative_url }}?v={{ css_version }}" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}?v={{ css_version }}"></noscript>
  </head>
  <body class="site-shell">
    {% include navbar.html %}
    {{ content}}
    <footer class="site-footer">
      <p class="footer-motto">"Be excellent to each other"</p>
      <p class="footer-credit">&copy; 2026 Georg Felix Dües | <a href="https://www.linkedin.com/in/georgduees/" target="_blank" rel="noopener noreferrer">LinkedIn</a></p>
    </footer>
  </body>
</html>
