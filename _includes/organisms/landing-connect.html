<section class="links-section">
  {% include atoms/section-title.html text="Contact" %}
  <div class="links-grid">
    {% for link in site.data.profile.social_links %}
      {% include molecules/social-button.html url=link.url icon=link.icon label=link.label %}
    {% endfor %}
    <a href="#" id="emailButton" target="_self" class="link-button email-link-combined" aria-label="Email">
      <span class="link-text" id="emailDisplay">Email</span>
    </a>
  </div>
  <p class="email-hint">(The address appears on page load and can be copied.)</p>
</section>
